<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Login | FUADSI Marketplace</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f4;color:#173b2b}
header{background:#fff;padding:18px;text-align:center;box-shadow:0 2px 10px #00000012}
header a{color:#006633;text-decoration:none;font-size:20px;font-weight:bold}
.container{max-width:430px;margin:45px auto;padding:30px 22px;background:#fff;border-radius:16px;box-shadow:0 5px 25px #00000012}
h1{text-align:center;color:#006633;font-size:25px}
.subtitle{text-align:center;color:#666;font-size:14px;line-height:1.6;margin-bottom:25px}
label{display:block;font-weight:bold;margin:16px 0 7px;font-size:14px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;font-size:15px}
input:focus{outline:2px solid #006633}
button{width:100%;margin-top:24px;padding:14px;background:#006633;color:white;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:15px;padding:12px;border-radius:8px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.success{display:block;background:#e3f6e9;color:#006633}
.error{display:block;background:#ffe8e8;color:#a30000}
.links{text-align:center;margin-top:20px;font-size:14px}
.links a{color:#006633;font-weight:bold}
footer{text-align:center;padding:20px;font-size:12px;color:#666}
@media(max-width:500px){.container{margin:20px 12px}}
</style>
</head>

<body>
<header><a href="index.html">FUADSI Marketplace</a></header>

<main class="container">
<h1>Vendor Login</h1>
<p class="subtitle">
Sign in to your external vendor account to continue to the FUADSI Marketplace.
</p>

<form id="loginForm">
<label for="email">Email Address</label>
<input id="email" type="email" autocomplete="username" required>

<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>

<button id="loginButton" type="submit">Sign In</button>
<div id="message" class="message" role="status" aria-live="polite"></div>
</form>

<p class="links"><a href="vendor-register.html">Register as a Vendor</a></p>
<p class="links"><a href="login.html">Regular Marketplace Login</a></p>
<p class="links"><a href="index.html">Back to Marketplace</a></p>
</main>

<footer>© 2026 FUADSI Marketplace. Independent campus marketplace.</footer>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nqpictelbfxgllolwvtv.supabase.co";
const SUPABASE_KEY = "sb_publishable__7FpB3Doz-4J379xf-YsZQ_zkcW8qQ_";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Signing in...";

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    const userId = data.user.id;

    // Confirm this account has an external vendor application.
    const { data: vendor, error: vendorError } = await supabase
      .from("external_vendors")
      .select("verification_status")
      .eq("user_id", userId)
      .maybeSingle();

    if (vendorError) {
      await supabase.auth.signOut();
      throw new Error(
        "We couldn't check your vendor application. Please try again later."
      );
    }

    if (!vendor) {
      await supabase.auth.signOut();
      throw new Error(
        "No vendor application was found for this account. Please register as an external vendor first."
      );
    }

    if (vendor.verification_status === "approved") {
      showMessage(
        "Login successful! Your vendor application is approved. The vendor dashboard is the next feature to connect.",
        "success"
      );
    } else if (vendor.verification_status === "rejected") {
      showMessage(
        "Your vendor application was rejected. Please contact the marketplace administrator for guidance.",
        "error"
      );
    } else {
      showMessage(
        "Login successful. Your vendor application is pending administrator approval. You cannot sell until it is approved.",
        "success"
      );
    }

  } catch (error) {
    showMessage(error.message || "Login failed. Check your details and try again.", "error");
  } finally {
    button.disabled = false;
    button.textContent = "Sign In";
  }
});
</script>
</body>
</html>
