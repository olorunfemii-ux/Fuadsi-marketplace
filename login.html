<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FUADSI Marketplace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #17251d;
    }

    .container {
      max-width: 430px;
      margin: 50px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px #00000010;
    }

    h1 { margin-bottom: 8px; }

    p {
      color: #647067;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd5ce;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #176b3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .hidden { display: none; }
    .success { background: #e7f7eb; color: #155b2d; }
    .error { background: #fff0ef; color: #a12620; }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      line-height: 2;
    }

    a { color: #176b3a; }
  </style>
</head>

<body>
  <main class="container">
    <h1>Welcome back</h1>
    <p>Log in to your FUADSI Marketplace account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Log In</button>
    </form>

    <div id="message" class="hidden" role="status" aria-live="polite"></div>

    <div class="links">
      New to FUADSI Marketplace?
      <a href="register.html">Create an account</a>
      <br>
      <a href="index.html">Back to marketplace</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://nqpictelbfxgllolwvtv.supabase.co";
    const SUPABASE_KEY = "sb_publishable__7FpB3Doz-4J379xf-YsZQ_zkcW8qQ_";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    async function routeAccount(user) {
async function routeAccount(user) {
  const accountType = user.user_metadata?.account_type;

  // Complete registration using the secure Supabase function.
  const { data: registrationResult, error: registrationError } =
    await supabaseClient.rpc("complete_account_registration");

  if (registrationError) {
    showMessage(
      "We couldn't complete your registration. Please check your details or contact the marketplace administrator. " +
      registrationError.message,
      "error"
    );
    return;
  }

  if (accountType === "external_vendor") {
    const { data: vendor, error } = await supabaseClient
      .from("external_vendors")
      .select("verification_status")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error || !vendor) {
      showMessage(
        "Your account is logged in, but your vendor application could not be loaded. Please try again.",
        "error"
      );
      return;
    }

    window.location.href = "vendor-dashboard.html";
    return;
  }

  if (accountType === "student") {
    const { data: profile, error } = await supabaseClient
      .from("profiles")
      .select("id, is_verified, student_verification_status")
      .eq("id", user.id)
      .maybeSingle();

    if (error || !profile) {
      showMessage(
        "Your student profile could not be loaded. Please contact the marketplace administrator.",
        "error"
      );
      return;
    }

    window.location.href = "dashboard.html";
    return;
  }

  showMessage(
    "Your account type is not recognized. Please contact the marketplace administrator.",
    "error"
  );
}
    form.addEventListener("submit", async event => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Logging in...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        await routeAccount(data.user);
      } catch (error) {
        showMessage(
          error.message || "Login failed. Please check your details and try again.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
