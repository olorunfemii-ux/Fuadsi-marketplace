<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | FUADSI Marketplace</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f7f4;
  color: #173b2b;
}

header {
  background: white;
  padding: 20px;
  text-align: center;
  box-shadow: 0 2px 10px #00000012;
}

header a {
  color: #006633;
  text-decoration: none;
  font-size: 21px;
  font-weight: bold;
}

.container {
  max-width: 430px;
  margin: 65px auto;
  padding: 30px 22px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 25px #00000012;
}

h1 {
  color: #006633;
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #666;
  line-height: 1.6;
}

label {
  display: block;
  margin: 18px 0 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 25px;
  background: #006633;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.message {
  display: none;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
}

.error {
  background: #ffe8e8;
  color: #a30000;
}

.success {
  background: #e3f6e9;
  color: #006633;
}

.links {
  text-align: center;
  margin-top: 20px;
}

.links a {
  color: #006633;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  color: #666;
  font-size: 12px;
}

@media(max-width:500px) {
  .container {
    margin: 25px 12px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html">FUADSI Marketplace</a>
</header>

<main class="container">
  <h1>Welcome Back!</h1>

  <p class="subtitle">
    Sign in to your FUADSI Marketplace account.
  </p>

  <form id="loginForm">

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button id="loginButton" type="submit">
      Login
    </button>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

  </form>

  <div class="links">
    <p>
      Don't have an account?
      <a href="register.html">Register</a>
    </p>
  </div>
</main>

<footer>
  © 2026 FUADSI Marketplace
</footer>

<script type="module">
import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nqpictelbfxgllolwvtv.supabase.co";
const SUPABASE_KEY = "sb_publishable__7FpB3Doz-4J379xf-YsZQ_zkcW8qQ_";

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (
  !SUPABASE_URL.startsWith("https://") ||
  SUPABASE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
) {
  showMessage(
    "Supabase connection is not configured.",
    "error"
  );
  return;
}
  button.disabled = true;
  button.textContent = "Signing in...";

  try {
    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const { error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    showMessage("Login successful!", "success");

    setTimeout(() => {
      window.location.href = "index.html";
    }, 1000);

  } catch (error) {
    showMessage(
      error.message || "Unable to log in.",
      "error"
    );
  } finally {
    button.disabled = false;
    button.textContent = "Login";
  }
});
</script>

</body>
</html>
