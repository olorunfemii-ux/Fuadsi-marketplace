<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | FUADSI Marketplace</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f7f4;
  color: #173b2b;
}

header {
  background: white;
  padding: 18px;
  text-align: center;
  box-shadow: 0 2px 10px #00000012;
}

header a {
  color: #006633;
  text-decoration: none;
  font-size: 20px;
  font-weight: bold;
}

.container {
  max-width: 430px;
  margin: 45px auto;
  padding: 30px 22px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 25px #00000012;
}

h1 {
  text-align: center;
  color: #006633;
  font-size: 25px;
}

.subtitle {
  text-align: center;
  color: #666;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 7px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

input:focus {
  outline: 2px solid #006633;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  background: #006633;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  display: none;
  font-size: 14px;
  line-height: 1.5;
}

.success {
  background: #e3f6e9;
  color: #006633;
}

.error {
  background: #ffe8e8;
  color: #a30000;
}

.login {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
}

.login a {
  color: #006633;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: #666;
}

@media(max-width: 500px) {
  .container {
    margin: 20px 12px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html">FUADSI Marketplace</a>
</header>

<div class="container">

  <h1>Create Your Account</h1>

  <p class="subtitle">
    Join FUADSI Marketplace and connect with
    buyers and sellers around campus.
  </p>

  <form id="registerForm">

    <label for="fullName">Full Name</label>
    <input
      type="text"
      id="fullName"
      placeholder="Enter your full name"
      autocomplete="name"
      maxlength="100"
      required
    >

    <label for="username">Username</label>
    <input
      type="text"
      id="username"
      placeholder="Choose a username"
      minlength="3"
      maxlength="30"
      pattern="[a-zA-Z0-9_]+"
      required
    >

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Create a password"
      autocomplete="new-password"
      minlength="8"
      required
    >

    <label for="confirmPassword">Confirm Password</label>
    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
      autocomplete="new-password"
      minlength="8"
      required
    >

    <button type="submit" id="registerButton">
      Create Account
    </button>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

  </form>

  <p class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </p>

</div>

<footer>
  © 2026 FUADSI Marketplace.
  Independent student marketplace.
</footer>

<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://nqpictelbfxgllolwvtv.supabase.co";

const SUPABASE_KEY = "sb_publishable__7FpB3Doz-4J379xf-YsZQ_zkcW8qQ_";

const form = document.getElementById("registerForm");

const button = document.getElementById("registerButton");

const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
  message.style.display = "block";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const fullName =
    document.getElementById("fullName").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    showMessage("Passwords do not match.", "error");
    return;
  }

  if (
    SUPABASE_URL === "YOUR_SUPABASE_URL" ||
    SUPABASE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
  ) {
    showMessage(
      "Supabase connection is not configured yet.",
      "error"
    );
    return;
  }

  button.disabled = true;
  button.textContent = "Creating account...";

  try {
    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const { error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo:
          window.location.origin +
          window.location.pathname.replace(
            /[^/]*$/,
            "login.html"
          ),
        data: {
          full_name: fullName,
          username: username
        }
      }
    });

    if (error) {
      throw error;
    }

    showMessage(
      "Registration request received! Check your email for a verification link.",
      "success"
    );

    form.reset();

  } catch (error) {
    showMessage(
      error.message || "Registration failed. Please try again.",
      "error"
    );
  } finally {
    button.disabled = false;
    button.textContent = "Create Account";
  }
});

</script>

</body>
</html>
