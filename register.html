<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | FUADSI Marketplace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #17251d;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 5px 25px #00000010;
    }

    h1 { margin-bottom: 8px; font-size: 27px; }
    .subtitle { color: #647067; line-height: 1.5; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5ce;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    textarea { resize: vertical; min-height: 90px; }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #176b3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    .hidden { display: none; }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success { background: #e7f7eb; color: #155b2d; }
    .error { background: #fff0ef; color: #a12620; }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    a { color: #176b3a; }
    .note { font-size: 13px; color: #68736b; line-height: 1.5; }
  </style>
</head>

<body>
  <main class="container">
    <h1>Create your account</h1>
    <p class="subtitle">Join FUADSI Marketplace — Your Campus, Your Market.</p>

    <form id="registrationForm">
      <label for="accountType">I want to register as</label>
      <select id="accountType" required>
        <option value="student">FUADSI Student</option>
        <option value="vendor">External Vendor</option>
      </select>

      <div id="studentFields">
        <label for="fullName">Full name</label>
        <input id="fullName" autocomplete="name">

        <label for="username">Username</label>
        <input id="username" autocomplete="username">

        <label for="matricNumber">Matriculation number</label>
        <input id="matricNumber" autocomplete="off">

        <p class="note">
          Student verification and document submission will be completed
          through the student verification process.
        </p>
      </div>

      <div id="vendorFields" class="hidden">
        <label for="contactName">Contact person's name</label>
        <input id="contactName" autocomplete="name" disabled>

        <label for="businessName">Business name</label>
        <input id="businessName" autocomplete="organization" disabled>

        <label for="phone">Phone number</label>
        <input id="phone" type="tel" autocomplete="tel" disabled>

        <label for="businessDescription">Business description</label>
        <textarea id="businessDescription" disabled></textarea>

        <p class="note">
          External vendor applications require approval before selling.
        </p>
      </div>

      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" minlength="8"
             autocomplete="new-password" required>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password"
             autocomplete="new-password" required>

      <button id="submitButton" type="submit">Create Student Account</button>
    </form>

    <div id="message" class="hidden" role="status" aria-live="polite"></div>

    <div class="footer">
      Already registered? <a href="login.html">Log in here</a>
      <br><br>
      <a href="index.html">Back to marketplace</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://nqpictelbfxgllolwvtv.supabase.co";
    const SUPABASE_KEY = "sb_publishable__7FpB3Doz-4J379xf-YsZQ_zkcW8qQ_";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("registrationForm");
    const accountType = document.getElementById("accountType");
    const studentFields = document.getElementById("studentFields");
    const vendorFields = document.getElementById("vendorFields");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function updateAccountType() {
      const isStudent = accountType.value === "student";

      studentFields.classList.toggle("hidden", !isStudent);
      vendorFields.classList.toggle("hidden", isStudent);

      studentFields.querySelectorAll("input").forEach(input => {
        input.disabled = !isStudent;
        input.required = isStudent;
      });

      vendorFields.querySelectorAll("input, textarea").forEach(input => {
        input.disabled = isStudent;
        input.required = !isStudent;
      });

      submitButton.textContent = isStudent
        ? "Create Student Account"
        : "Create Vendor Account";

      message.className = "hidden";
    }

    accountType.addEventListener("change", updateAccountType);
    updateAccountType();

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const type = accountType.value;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage("Your password must contain at least 8 characters.", "error");
        return;
      }

      const fullName = type === "student"
        ? document.getElementById("fullName").value.trim()
        : document.getElementById("contactName").value.trim();

      const username = type === "student"
        ? document.getElementById("username").value.trim()
        : "";

      const matricNumber = type === "student"
        ? document.getElementById("matricNumber").value.trim()
        : "";

      const businessName = type === "vendor"
        ? document.getElementById("businessName").value.trim()
        : "";

      const phone = type === "vendor"
        ? document.getElementById("phone").value.trim()
        : "";

      const businessDescription = type === "vendor"
        ? document.getElementById("businessDescription").value.trim()
        : "";

      if (type === "student" && !/^\d{4,}$/.test(matricNumber.replace(/\D/g, ""))) {
        showMessage(
          "Enter a valid matriculation number containing at least four digits.",
          "error"
        );
        return;
      }

      if (type === "vendor" && (!businessName || !phone)) {
        showMessage("Enter your business name and phone number.", "error");
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Creating account...";

      try {
        /*
         * Save the application details temporarily in this browser session.
         * Passwords are never saved here.
         * A later authenticated application step must submit these details.
         */
        const application = type === "vendor"
          ? {
              account_type: "external_vendor",
              contact_name: fullName,
              business_name: businessName,
              phone,
              business_description: businessDescription
            }
          : {
              account_type: "student",
              full_name: fullName,
              username,
              matric_number: matricNumber
            };

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: window.location.origin +
              window.location.pathname.replace(/register\.html$/, "login.html"),
            data: application
          }
        });

        if (error) throw error;

        if (!data.user) {
          throw new Error("Account creation did not complete. Please try again.");
        }

        /*
         * Keep only non-secret application details for the next step.
         * Do not assume the application has been saved to its database table.
         */
        sessionStorage.setItem(
          "fuadsi_pending_application",
          JSON.stringify({
            user_id: data.user.id,
            email,
            ...application
          })
        );

        if (data.session) {
          showMessage(
            type === "student"
              ? "Your account was created. Student verification still needs to be completed."
              : "Your account was created. Your vendor application still needs to be submitted for review.",
            "success"
          );
        } else {
          showMessage(
            "Your account was created. Check your email to confirm it, then log in to continue. Keep this browser session open so your application details remain available. Your application has not yet been submitted for approval.",
            "success"
          );
        }

        form.reset();
        accountType.value = "student";
        updateAccountType();

      } catch (error) {
        showMessage(error.message || "Registration failed. Please try again.", "error");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = accountType.value === "student"
          ? "Create Student Account"
          : "Create Vendor Account";
      }
    });
  </script>
</body>
</html>
